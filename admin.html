<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青藤画室 · 网站后台管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%233C5A49'/%3E%3Cpath d='M14 18c10 2 18 8 20 20 1-8 4-16 16-20-6 12-10 18-10 26 0 4 2 6 4 7-5-1-9-5-10-9-2 5-8 9-14 10 4-8 4-14 2-19-1-5-4-9-8-15z' fill='%23F6F4EE'/%3E%3C/svg%3E">
<style>
:root{--paper:#F4F1EA;--ink:#1B1A18;--ink2:#5C574E;--ink3:#8C867A;--moss:#3C5A49;--moss2:#2C4436;--line:#E2DDD1;--white:#FFFFFF;--danger:#A33;--ok:#3C5A49}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--moss)}
textarea{resize:vertical;line-height:1.8}
label{display:block;font-size:12.5px;color:var(--ink2);margin:14px 0 5px;font-weight:500}
.hint{font-size:12px;color:var(--ink3);margin-top:4px;font-weight:300}
.btn{border:1px solid var(--line);background:#fff;border-radius:3px;padding:8px 16px;font-size:13.5px;color:var(--ink);transition:all .2s}
.btn:hover{border-color:var(--moss);color:var(--moss)}
.btn-p{background:var(--moss);color:#F4F1E8;border-color:var(--moss)}
.btn-p:hover{background:var(--moss2);color:#fff}
.btn-d{border-color:#e0c9c9;color:var(--danger)}
.btn-d:hover{border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 登录屏 */
#loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.login-card{width:360px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:40px 36px;box-shadow:0 12px 40px rgba(27,26,24,.06)}
.login-card .lc-logo{width:52px;height:52px;margin:0 auto 14px;display:block}
.login-card h1{font-size:20px;text-align:center;font-weight:700;letter-spacing:.05em}
.login-card .lc-sub{text-align:center;color:var(--ink3);font-size:12.5px;margin:6px 0 22px}
.login-err{color:var(--danger);font-size:12.5px;text-align:center;min-height:18px;margin-top:10px}

/* 布局 */
#app{display:none}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--moss);color:#EDEADF;display:flex;align-items:center;padding:0 22px;z-index:50;gap:16px}
.topbar .tb-brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.topbar .tb-brand svg{width:26px;height:26px}
.topbar .tb-sp{flex:1}
.topbar .tb-link{color:#CFE3D6;font-size:13px;text-decoration:none;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:3px;white-space:nowrap}
.topbar .tb-link:hover{background:rgba(255,255,255,.12)}
.sidebar{position:fixed;top:56px;bottom:0;left:0;width:196px;background:#2A2A28;color:#C9C6BC;overflow-y:auto;padding:14px 0 30px;z-index:40}
.sidebar .sb-group{font-size:11px;color:#8B887E;letter-spacing:.18em;padding:16px 22px 6px}
.sidebar a{display:flex;align-items:center;gap:9px;padding:9px 22px;color:#C9C6BC;text-decoration:none;font-size:13.5px;border-left:3px solid transparent;transition:all .15s}
.sidebar a svg{width:15px;height:15px;flex:none;opacity:.75}
.sidebar a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar a.active{background:rgba(60,90,73,.32);color:#fff;border-left-color:#8FB29B}
.main{margin-left:196px;margin-top:56px;padding:28px 34px;max-width:1060px}
.page-title{font-size:20px;font-weight:700;letter-spacing:.03em;margin-bottom:4px}
.page-sub{color:var(--ink3);font-size:13px;margin-bottom:22px;font-weight:300}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:24px 26px;margin-bottom:20px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card h3 .ct{color:var(--ink3);font-weight:400;font-size:12.5px;margin-left:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 18px}
.actions{margin-top:18px;display:flex;gap:10px;align-items:center}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .sp{flex:1}
.search{max-width:240px}

/* 列表 */
.item-list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:#FAF8F2;border:1px solid var(--line);border-radius:5px;padding:12px 14px}
.item .ic-thumb{width:56px;height:56px;border-radius:4px;object-fit:cover;flex:none;background:#EFEBE1}
.item .ic-body{flex:1;min-width:0}
.item .ic-t{font-size:14px;font-weight:600;line-height:1.4}
.item .ic-s{font-size:12px;color:var(--ink3);font-weight:300;line-height:1.6;margin-top:2px}
.item .ic-ops{display:flex;gap:6px;flex:none}
.badge{display:inline-block;background:#EFEBE1;color:var(--moss);border:1px solid var(--line);font-size:11px;padding:1px 9px;border-radius:999px;margin-right:6px;white-space:nowrap}
.empty{padding:34px;text-align:center;color:var(--ink3);font-size:13px;font-weight:300}
.tag-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fa{font-size:13px}

/* toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#F4F1E8;padding:11px 26px;border-radius:4px;font-size:13.5px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.2)}
#toast.show{opacity:1}
.upload-zone{border:2px dashed var(--line);border-radius:6px;padding:22px;text-align:center;color:var(--ink3);cursor:pointer;transition:all .2s;background:#FCFAF5}
.upload-zone:hover{border-color:var(--moss);color:var(--moss)}
.upload-zone input{display:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.g-item{position:relative;background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.g-item img{width:100%;height:110px;object-fit:cover;display:block}
.g-item .g-cap{padding:7px 9px;font-size:11.5px;color:var(--ink2);line-height:1.5}
.g-item .g-del{position:absolute;top:6px;right:6px;background:rgba(27,26,24,.72);color:#fff;border:none;border-radius:3px;width:24px;height:24px;font-size:13px;line-height:1}
.g-item .g-del:hover{background:var(--danger)}
.g-item .g-choose{position:absolute;bottom:6px;right:6px;background:var(--moss);color:#fff;border:none;border-radius:3px;padding:4px 8px;font-size:11px;opacity:.9}
.g-item .g-choose:hover{opacity:1}
.g-item.chosen{outline:2px solid var(--moss)}
@media (max-width:760px){
  .sidebar{display:none}
  .main{margin-left:0;padding:20px 16px}
  .row2,.row3{grid-template-columns:1fr}
  .topbar .tb-link{display:none}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginScreen">
  <div class="login-card">
    <svg class="lc-logo" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="12" fill="#3C5A49"/><path d="M14 18c10 2 18 8 20 20 1-8 4-16 16-20-6 12-10 18-10 26 0 4 2 6 4 7-5-1-9-5-10-9-2 5-8 9-14 10 4-8 4-14 2-19-1-5-4-9-8-15z" fill="#F6F4EE"/></svg>
    <h1>青藤画室 · 网站后台</h1>
    <p class="lc-sub">输入管理密码进入维护系统</p>
    <label for="pwInput">管理密码</label>
    <input id="pwInput" type="password" placeholder="请输入密码" autocomplete="current-password">
    <div class="login-err" id="loginErr"></div>
    <button class="btn btn-p" id="loginBtn" style="width:100%;padding:11px">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header class="topbar">
    <div class="tb-brand">
      <svg viewBox="0 0 64 64" fill="none"><path d="M14 18c10 2 18 8 20 20 1-8 4-16 16-20-6 12-10 18-10 26 0 4 2 6 4 7-5-1-9-5-10-9-2 5-8 9-14 10 4-8 4-14 2-19-1-5-4-9-8-15z" fill="#F6F4EE"/></svg>
      青藤画室官网后台
    </div>
    <div class="tb-sp"></div>
    <a class="tb-link" href="index.html" target="_blank">打开前台首页</a>
    <a class="tb-link" href="javascript:void(0)" id="rebuildBtn">重建全站</a>
    <a class="tb-link" href="javascript:void(0)" id="logoutBtn">退出登录</a>
  </header>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main" id="view"></main>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ================= 基础 ================= */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
let TOKEN = localStorage.getItem("qt_token") || "";

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.background = isErr ? "#8C3A3A" : "#1B1A18";
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(method, path, data, raw) {
  const headers = { "X-Token": TOKEN };
  let body = null;
  if (data !== undefined) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(data);
  } else if (raw !== undefined) {
    headers["Content-Type"] = "application/octet-stream";
    body = raw;
  }
  const res = await fetch(path, { method, headers, body });
  let j = null;
  try { j = await res.json(); } catch (e) {}
  if (res.status === 401 && !path.includes("/api/login")) {
    localStorage.removeItem("qt_token");
    location.reload();
  }
  if (!res.ok && j) throw new Error(j.error || "请求失败");
  return j;
}
async function loadData(module) { return await api("GET", "/api/data/" + module); }
async function saveData(module, data, msg) {
  await api("POST", "/api/save", { module, data });
  toast(msg || "已保存，前台页面已同步更新");
}
function uploadFiles(files, folder, onEach) {
  const list = Array.from(files);
  let i = 0;
  const results = [];
  async function next() {
    if (i >= list.length) return results;
    const f = list[i++];
    const j = await api("POST", "/api/upload?folder=" + folder + "&name=" + encodeURIComponent(f.name), undefined, f);
    results.push(j.url);
    if (onEach) onEach(j.url, i, list.length);
    return next();
  }
  return next();
}
function confirmDel(msg) { return window.confirm(msg || "确定删除？此操作不可恢复。"); }

/* ================= 导航 ================= */
const NAV = [
  { group: "内容管理" },
  { key: "site", label: "首页内容", icon: "M3 12l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" },
  { key: "founder", label: "创始人管理", icon: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 4-6 8-6s8 2 8 6" },
  { key: "teacher", label: "首页教师介绍", icon: "M16 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c0-4 4-6 8-6M22 21c0-3-2-5-5-6" },
  { key: "courses", label: "课程管理", icon: "M4 5h16v4H4zM4 11h16v4H4zM4 17h10v4H4z" },
  { key: "works", label: "学生作品", icon: "M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z" },
  { key: "cases", label: "成长案例", icon: "M12 21s-7-5.6-7-11a7 7 0 1 1 14 0c0 5.4-7 11-7 11zM12 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" },
  { key: "leads", label: "咨询线索", icon: "M21 11.5a8.4 8.4 0 0 1-8.5 8.4c-1.4 0-2.8-.3-4-.8L3 20l1-4.4a8.4 8.4 0 0 1-1.5-4.1 8.4 8.4 0 0 1 8.5-8.4 8.4 8.4 0 0 1 10 9.4z" },
  { group: "问答 · 文章" },
  { key: "faq", label: "常见问题 FAQ", icon: "M9 9a3 3 0 1 1 5.5 1.8c-.9 1-1.5 1.4-1.5 2.7M12 18h.01" },
  { key: "articles", label: "文章管理", icon: "M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6" },
  { group: "升学规划中心" },
  { key: "planning", label: "升学规划栏目", icon: "M4 19V5M4 19h16M7 16l3-5 3 3 4-7" },
  { group: "系统" },
  { key: "account", label: "账号设置", icon: "M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21c0-4 4-6 8-6s8 2 8 6" },
  { key: "settings", label: "微信通知设置", icon: "M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10.3 21a1.94 1.94 0 0 0 3.4 0" },
  { key: "help", label: "使用说明", icon: "M4 4h16v13H9l-5 4zM9 9h6M9 12h4" },
];

function renderNav() {
  $("#sidebar").innerHTML = NAV.map(n => {
    if (n.group) return '<div class="sb-group">' + esc(n.group) + "</div>";
    return '<a href="javascript:void(0)" data-key="' + n.key + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + n.icon + '"/></svg>' + esc(n.label) + "</a>";
  }).join("");
  $$("#sidebar a").forEach(a => a.addEventListener("click", () => { setActive(a.dataset.key); go(a.dataset.key); }));
}
function setActive(k) {
  $$("#sidebar a").forEach(a => a.classList.toggle("active", a.dataset.key === k));
}
const VIEWS = {};
function go(key) {
  setActive(key);
  if (VIEWS[key]) VIEWS[key]();
}
function setView(title, sub, html) {
  $("#view").innerHTML = '<div class="page-title">' + esc(title) + '</div><div class="page-sub">' + esc(sub) + '</div>' + html;
}

/* ================= 登录 ================= */
async function doLogin() {
  const pw = $("#pwInput").value;
  $("#loginErr").textContent = "";
  if (!pw) { $("#loginErr").textContent = "请输入密码"; return; }
  const b = $("#loginBtn");
  b.disabled = true; b.textContent = "登录中…";
  try {
    const j = await api("POST", "/api/login", { password: pw });
    TOKEN = j.token;
    localStorage.setItem("qt_token", TOKEN);
    enterApp();
  } catch (e) {
    $("#loginErr").textContent = e.message || "登录失败";
    b.disabled = false; b.textContent = "登 录";
  }
}
function enterApp() {
  $("#loginScreen").style.display = "none";
  $("#app").style.display = "block";
  renderNav();
  go("site");
}
$("#loginBtn").addEventListener("click", doLogin);
$("#pwInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("#logoutBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/logout"); } catch (e) {}
  localStorage.removeItem("qt_token");
  location.reload();
});
$("#rebuildBtn").addEventListener("click", async () => {
  const b = $("#rebuildBtn");
  b.textContent = "重建中…";
  try { const j = await api("POST", "/api/rebuild"); toast(j.message); }
  catch (e) { toast(e.message, true); }
  b.textContent = "重建全站";
});
if (TOKEN) {
  (async () => {
    try { await api("GET", "/api/data/site"); enterApp(); } catch (e) {}
  })();
}

/* ================= 工具：表单绑定 ================= */
function bindForm(root, obj) {
  $$("[data-path]", root).forEach(el => {
    const path = el.dataset.path.split(".");
    let v = obj;
    for (const k of path) v = v == null ? undefined : v[k];
    if (el.type === "checkbox") el.checked = !!v;
    else el.value = v == null ? "" : v;
  });
}
function collectForm(root) {
  const out = {};
  $$("[data-path]", root).forEach(el => {
    const path = el.dataset.path.split(".");
    let cur = out;
    for (let i = 0; i < path.length - 1; i++) {
      if (!cur[path[i]]) cur[path[i]] = {};
      cur = cur[path[i]];
    }
    cur[path[path.length - 1]] = el.type === "checkbox" ? el.checked : el.value.trim();
  });
  return out;
}

/* ================= 视图：创始人管理 ================= */
let FB = null;
VIEWS.founder = async () => {
  FB = await loadData("fabout");
  founderView();
};
function fRow(lbl, inner) { return `<div><label>${lbl}</label>${inner}</div>`; }
function founderView() {
  const fb = FB;
  const prof = fb.profile || {}, hero = fb.hero || {};
  const meta = (hero.meta || []).map((m, i) =>
    `<div class="item"><div class="ic-body">
      <div class="row2"><div><input data-meta-i="${i}" value="${esc(m.i||'')}" placeholder="英文小标"></div>
      <div><input data-meta-b="${i}" value="${esc(m.b||'')}" placeholder="中文内容"></div></div>
    </div><div class="ic-ops"><button class="btn btn-d btn-sm" data-delmeta="${i}">删</button></div></div>`).join("");
  const tl = (arr, key) => (arr||[]).map((it,i) =>
    `<div class="item" data-tl="${key}" data-i="${i}"><div class="ic-body">
      <div class="row3"><div><input data-time value="${esc(it.time||'')}" placeholder="时间/阶段"></div>
      <div><input data-title value="${esc(it.title||'')}" placeholder="标题"></div>
      <div><input data-dot value="${esc(it.dot||'')}" placeholder="dot（current 留空）"></div></div>
      <label>说明</label><textarea data-desc rows="2">${esc(it.desc||'')}</textarea>
    </div><div class="ic-ops"><button class="btn btn-d btn-sm" data-deltl="${key}|${i}">删</button></div></div>`).join("");
  const itm = (arr, key) => (arr||[]).map((it,i) =>
    `<div class="item" data-itm="${key}" data-i="${i}"><div class="ic-body">
      <div class="row2"><div><input data-num value="${esc(it.num||'')}" placeholder="编号/小标题"></div>
      <div><input data-title value="${esc(it.title||'')}" placeholder="标题"></div></div>
      <label>说明</label><textarea data-desc rows="2">${esc(it.desc||'')}</textarea>
    </div><div class="ic-ops"><button class="btn btn-d btn-sm" data-delitm="${key}|${i}">删</button></div></div>`).join("");

  const photoGroups = (fb.photos||{groups:[]}).groups.map((g,gi) =>
    `<div class="card" data-pg="${gi}"><h3>照片分类：${esc(g.cat||'')} <span class="ct">上传后自动保存</span></h3>
      <div class="gallery">${(g.items||[]).map((it,ii) =>
        `<div class="g-item"><img src="${esc(it.src)}" alt=""><div class="g-cap"><input value="${esc(it.cap||'')}" data-cap placeholder="说明" style="padding:4px 6px;font-size:11px"></div>
         <button class="g-del" data-delphoto="${gi}|${ii}">×</button></div>`).join("")}
      </div>
      <div class="upload-zone" data-uploadphoto="${gi}">点击上传照片（可多选）<input type="file" accept="image/*" multiple></div>
    </div>`).join("");

  const workGroups = (fb.works||{groups:[]}).groups.map((g,gi) =>
    `<div class="card" data-wg="${gi}"><h3>作品分类：${esc(g.cat||'')} <span class="ct">上传后自动保存</span></h3>
      <div class="gallery">${(g.items||[]).map((it,ii) =>
        `<div class="g-item"><img src="${esc(it.src)}" alt=""><div class="g-cap"><input value="${esc(it.cap||'')}" data-cap placeholder="说明" style="padding:4px 6px;font-size:11px"></div>
         <button class="g-del" data-delwork="${gi}|${ii}">×</button></div>`).join("")}
      </div>
      <div class="upload-zone" data-uploadwork="${gi}">点击上传作品（可多选）<input type="file" accept="image/*" multiple></div>
    </div>`).join("");

  setView("创始人管理", "修改姓名、经历、理念、照片、作品等。保存后「关于创始人」页自动更新。", `
  <div class="card"><h3>创始人信息 <span class="ct">支持多位创始人，并排显示在前台页头</span></h3>
    <div id="fPros">
    ${(FB.profiles||[]).map((pr,pi) => `
      <div class="item" data-pro="${pi}" style="flex-direction:column;align-items:stretch;gap:10px">
        <div class="bar"><b>创始人 ${pi+1}</b><span class="sp"></span><button class="btn btn-d btn-sm" data-delpro="${pi}">删除</button></div>

  <div class="card"><div class="row2">
    ${fRow("作品区小标题", `<input data-path="works.kicker">`)}
    ${fRow("作品区大标题", `<input data-path="works.title">`)}
  </div>
  <label>作品区说明</label><input data-path="works.sub">
  </div>
  ${workGroups}

  <div class="card"><h3>底部行动区</h3>
    <div class="row2">
      ${fRow("标题", `<input data-path="cta.title">`)}
      ${fRow("按钮文字", `<input data-path="cta.btn">`)}
    </div>
    <label>说明</label><textarea data-path="cta.sub" rows="2"></textarea>
  </div>

  <div class="actions"><button class="btn btn-p" id="fbSave" style="padding:10px 30px">保存全部并同步前台</button></div>
  `);

  // 回填简单字段
  bindForm($("#view"), fb);
  // 动态创始人增删
  $("#addPro").onclick = () => {
    FB.profiles.push({name:"",gender:"",phone:"",photo:"",photoAlt:"青藤画室创始人",bio:""});
    founderView();
  };
  $$("[data-delpro]").forEach(b => b.onclick = () => {
    if (!confirmDel("删除这位创始人？")) return;
    FB.profiles.splice(Number(b.dataset.delpro),1);
    founderView();
  });
  // 创始人头像上传
  $$("[data-uploadpro]").forEach(btn => btn.onclick = () => {
    const pi = btn.dataset.uploadpro;
    $("#proinp-" + pi).click();
  });
  $$("[data-proinp]").forEach(inp => inp.onchange = async () => {
    const pi = Number(inp.dataset.proinp);
    try {
      const urls = await uploadFiles(inp.files, "founder");
      if (urls && urls[0]) {
        FB.profiles[pi].photo = urls[0];
        const card = inp.closest("[data-pro]");
        card.querySelector("[data-pphoto]").value = urls[0];
        const pv = card.querySelector("[data-ppreview]");
        pv.src = urls[0]; pv.style.opacity = "1";
        toast("头像已上传，点保存按钮生效");
      }
    } catch (e) { toast(e.message, true); }
  });

  // 数组编辑器：增删
  const addRow = (boxId, tplHtml) => { const b = $("#"+boxId); b.insertAdjacentHTML("beforeend", tplHtml); };
  $("#addMeta").onclick = () => addRow("fMeta", `<div class="item"><div class="ic-body"><div class="row2"><div><input placeholder="英文小标"></div><div><input placeholder="中文内容"></div></div></div></div>`);
  $("#addEdu").onclick = () => addRow("fEdu", `<div class="item"><div class="ic-body"><div class="row3"><div><input placeholder="时间"></div><div><input placeholder="标题"></div><div><input placeholder="dot"></div></div><textarea rows="2" placeholder="说明"></textarea></div></div>`);
  $("#addExp").onclick = () => addRow("fExp", `<div class="item"><div class="ic-body"><div class="row3"><div><input placeholder="时间"></div><div><input placeholder="标题"></div><div><input placeholder="dot"></div></div><textarea rows="2" placeholder="说明"></textarea></div></div>`);
  $("#addI1").onclick = () => addRow("fI1", `<div class="item"><div class="ic-body"><div class="row2"><div><input placeholder="编号"></div><div><input placeholder="标题"></div></div><textarea rows="2" placeholder="说明"></textarea></div></div>`);
  $("#addI2").onclick = () => addRow("fI2", `<div class="item"><div class="ic-body"><div class="row2"><div><input placeholder="编号"></div><div><input placeholder="标题"></div></div><textarea rows="2" placeholder="说明"></textarea></div></div>`);

  // 删除委托
  $("#view").onclick = (e) => {
    const del = e.target.closest("[data-deltl],[data-delitm],[data-delmeta]");
    if (del) { del.closest(".item").remove(); }
  };

  // 照片上传
  $$("[data-uploadphoto]").forEach(zone => {
    const gi = zone.dataset.uploadphoto;
    const inp = zone.querySelector("input[type=file]");
    zone.onclick = (e) => { if (e.target.tagName !== "INPUT") inp.click(); };
    inp.onchange = async () => {
      try {
        const urls = await uploadFiles(inp.files, "founder", (u,i,n)=>toast(`上传中 ${i}/${n}`));
        for (const url of urls) {
          FB.photos.groups[gi].items.push({src:url, alt:"", cap:""});
        }
        await saveData("fabout", FB, `照片已上传（${urls.length} 张）`);
        founderView();
      } catch (err) { toast(err.message, true); }
    };
  });
  // 作品上传
  $$("[data-uploadwork]").forEach(zone => {
    const gi = zone.dataset.uploadwork;
    const inp = zone.querySelector("input[type=file]");
    zone.onclick = (e) => { if (e.target.tagName !== "INPUT") inp.click(); };
    inp.onchange = async () => {
      try {
        const urls = await uploadFiles(inp.files, "founder", (u,i,n)=>toast(`上传中 ${i}/${n}`));
        for (const url of urls) {
          FB.works.groups[gi].items.push({src:url, alt:"", cap:""});
        }
        await saveData("fabout", FB, `作品已上传（${urls.length} 张）`);
        founderView();
      } catch (err) { toast(err.message, true); }
    };
  });
  // 删除照片/作品
  $$("[data-delphoto]").forEach(b => b.onclick = async () => {
    if (!confirmDel("删除这张照片？")) return;
    const [gi,ii] = b.dataset.delphoto.split("|").map(Number);
    FB.photos.groups[gi].items.splice(ii,1);
    await saveData("fabout", FB, "照片已删除");
    founderView();
  });
  $$("[data-delwork]").forEach(b => b.onclick = async () => {
    if (!confirmDel("删除这件作品？")) return;
    const [gi,ii] = b.dataset.delwork.split("|").map(Number);
    FB.works.groups[gi].items.splice(ii,1);
    await saveData("fabout", FB, "作品已删除");
    founderView();
  });
  // 照片/作品说明同步
  $$("[data-cap]").forEach(inp => inp.onchange = async () => {
    const gItem = inp.closest("[data-pg],[data-wg]");
    const isPhoto = gItem.hasAttribute("data-pg");
    const gi = (isPhoto ? gItem.dataset.pg : gItem.dataset.wg);
    const card = inp.closest(".g-item");
    const ii = Array.from(gItem.querySelectorAll(".g-item")).indexOf(card);
    const arr = (isPhoto ? FB.photos.groups[gi].items : FB.works.groups[gi].items);
    if (arr[ii]) { arr[ii].cap = inp.value; arr[ii].alt = inp.value; }
  });

  // 保存全部
  $("#fbSave").onclick = async () => {
    const f = collectForm($("#view"));
    // 合并到 FB（保留未在表单中的字段）
    const merge = (dst, src) => { for (const k in src) { if (src[k] && typeof src[k]==="object" && !Array.isArray(src[k])) merge(dst[k]||(dst[k]={}), src[k]); else dst[k]=src[k]; } };
    merge(FB, f);
    // 收集 meta
    FB.hero.meta = $$("#fMeta .item").map(el => {
      const ins = el.querySelectorAll("input");
      return {i: ins[0].value, b: ins[1].value};
    });
    // 收集 timeline
    const collectTl = (boxSel, key) => $$(boxSel+" .item").map(el => ({
      time: el.querySelector("[data-time]").value,
      title: el.querySelector("[data-title]").value,
      desc: el.querySelector("[data-desc]").value,
      dot: el.querySelector("[data-dot]").value
    }));
    FB.profiles = $$("#fPros [data-pro]").map(el => ({
      name: el.querySelector("[data-pname]").value,
      gender: el.querySelector("[data-pgender]").value,
      phone: el.querySelector("[data-pphone]").value,
      photo: el.querySelector("[data-pphoto]").value,
      photoAlt: "青藤画室创始人",
      bio: el.querySelector("[data-pbio]").value
    }));
    FB.edu.timeline = collectTl("#fEdu","edu");
    FB.exp.timeline = collectTl("#fExp","exp");
    FB.idea1.items = $$("#fI1 .item").map(el => ({
      num: el.querySelector("[data-num]").value,
      title: el.querySelector("[data-title]").value,
      desc: el.querySelector("[data-desc]").value
    }));
    FB.idea2.items = $$("#fI2 .item").map(el => ({
      num: el.querySelector("[data-num]").value,
      title: el.querySelector("[data-title]").value,
      desc: el.querySelector("[data-desc]").value
    }));
    try { await saveData("fabout", FB, "已保存，「关于创始人」页已同步更新"); }
    catch (e) { toast(e.message, true); }
  };
}

  <div class="actions"><button class="btn btn-p" id="tSave" style="padding:10px 30px">保存并同步首页</button></div>

  $("#addExp").onclick = () => {

  };

    if (d) d.closest(".item").remove();
  };
  // 照片上传
  $("#tUpBtn").onclick = () => $("#tUp").click();

  function _wireClear(btn, field, prev, label) {
    $(btn).addEventListener("click", async () => {

      cur.contact[field] = "";

  _wireClear("#wxClearBtn1","wechatImg1","[data-wxpreview1]","二维码1");
  _wireClear("#wxClearBtn2","wechatImg2","[data-wxpreview2]","二维码2");
};

    $("#aName").value = a ? a.title || "" : "";
    $("#aCat").value = a ? a.cat || "" : "";
    $("#aDate").value = a ? a.date || "" : "";
    $("#aMeta").value = a ? a.meta || "" : "";
    $("#aFile").value = "";
    $("#aFile").disabled = editing >= 0;
    $("#aLead").value = a ? a.lead || "" : "";
    $("#aTags").value = a ? (a.tags || []).join(", ") : "";
    $("#aBody").value = editing >= 0 && ART_BODIES[a.file] ? ART_BODIES[a.file] : "";
    $("#aForm").scrollIntoView({ behavior: "smooth" });
  };
  const loadBodies = async (file) => {
    if (ART_BODIES[file] !== undefined) return ART_BODIES[file];
    const r = await fetch("data/content/articles/" + file);
    if (r.ok) { ART_BODIES[file] = await r.text(); return ART_BODIES[file]; }
    return "";
  };
  $("#aAdd").addEventListener("click", () => { editing = -1; showForm(null); });
  $("#aSaveOne").addEventListener("click", async () => {

    const tags = $("#aTags").value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    const body = $("#aBody").value;
    if (!title || !body.trim()) { toast("标题和正文都要填写", true); return; }

      ARTICLES[editing] = { ...ARTICLES[editing], title, cat, date, meta, lead, tags };
      ART_BODIES[ARTICLES[editing].file] = body;
    } else {
      let slug = $("#aFile").value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "article";
      if (ARTICLES.some(a => a.file === slug + ".html")) slug += "-" + Date.now().toString().slice(-6);
      const file = slug + ".html";
      ARTICLES.push({ file, title, cat, date, meta, lead, tags });
      ART_BODIES[file] = body;
    }
    toast("已暂存，请点「保存全部」生成前台页面");
    articlesView();
  });
  $("#aCancelOne").addEventListener("click", () => articlesView());
  $("#aSave").addEventListener("click", async () => {
    try {
      await saveData("articles", { items: ARTICLES, bodies: ART_BODIES }, "文章已保存，前台文章页已生成（含自动目录与相关推荐）");
    } catch (e) { toast(e.message, true); }
  });
  $$(".item [data-up]").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.up; [ARTICLES[i-1], ARTICLES[i]] = [ARTICLES[i], ARTICLES[i-1]]; articlesView(); }));
  $$(".item [data-down]").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.down; [ARTICLES[i+1], ARTICLES[i]] = [ARTICLES[i], ARTICLES[i+1]]; articlesView(); }));
  $$(".item [data-edit]").forEach(b => b.addEventListener("click", async () => {
    editing = +b.dataset.edit;
    const a = ARTICLES[editing];
    if (ART_BODIES[a.file] === undefined) ART_BODIES[a.file] = await loadBodies(a.file);
    showForm(a);
  }));
  $$(".item [data-open]").forEach(b => b.addEventListener("click", () => window.open("articles/" + ARTICLES[+b.dataset.open].file, "_blank")));
  $$(".item [data-del]").forEach(b => b.addEventListener("click", async () => {
    if (!confirmDel("删除该文章？前台对应页面将不再生成。")) return;
    const a = ARTICLES[+b.dataset.del];
    ARTICLES.splice(+b.dataset.del, 1);
    delete ART_BODIES[a.file];
    try { await api("POST", "/api/delete", { url: "" }); } catch (e) {}
    await saveData("articles", { items: ARTICLES, bodies: ART_BODIES }, "文章已删除");
    articlesView();
  }));
}

      <td>${esc(l.grade||'-')}</td>

      <td>${esc(l.course||'-')}</td>
      <td style="max-width:180px"><div style="font-size:12px;color:var(--ink3);line-height:1.5">${esc(l.message||'-')}</div></td>
      <td>${esc(l.source||'-')}</td>
      <td>${esc(l.time||'')}</td>
      <td><select data-status="${i}" style="padding:4px 6px;font-size:12px">
        ${STATUS.map(x=>`<option value="${x}" ${x===(l.status||'未联系')?'selected':''}>${x}</option>`).join("")}
      </select></td>
    </tr>`).join("");

  setView("咨询线索", "所有表单提交自动入库并微信通知。点电话可直接拨号，状态可在右侧下拉修改。", `
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    ${statCard("今日新增", st.today)}
    ${statCard("本周新增", st.week)}
    ${statCard("本月新增", st.month)}
    ${statCard("未联系", st.untouched, '#A33')}
    ${statCard("试听预约", st.trial)}
    ${statCard("白皮书领取", st.whitepaper)}
  </div>
  <div class="card">
    <div class="bar"><b>最近线索（按时间倒序）</b><div class="sp"></div>
      <button class="btn" id="leadRefresh">刷新</button>
    </div>
    <div style="overflow-x:auto">
    <table class="tbl" style="width:100%;min-width:820px">
      <thead><tr>
        <th>称呼</th><th>年级</th><th>电话</th><th>项目</th><th>留言</th><th>来源</th><th>时间</th><th>状态</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:#999;padding:24px">暂无线索，家长提交表单后会自动出现在这里</td></tr>'}</tbody>
    </table>
    </div>
  </div>`);

  $("#leadRefresh").addEventListener("click", () => VIEWS.leads());
  $$("[data-status]").forEach(sel => sel.addEventListener("change", async () => {
    const l = leads[+sel.dataset.status];
    try {
      await api("POST", "/api/lead-status", { id: l.id, status: sel.value });
      toast("状态已更新为：" + sel.value);
    } catch (e) { toast(e.message, true); }
  }));
};

/* ================= 视图：微信通知设置 ================= */
VIEWS.settings = async () => {
  let s;
  try { s = await loadData("settings"); } catch (e) { s = {}; }
  s = s || {};
  const sc = s.serverchan || {};
  const pp = s.pushplus || {};
  const wc = s.wecom || {};
  const ch = s.notifyChannel || "serverchan";
  setView("微信通知设置", "家长提交表单后，微信立即收到提醒。先选渠道，再填对应 Key/Token/Webhook，保存后立即生效。", `
  <div class="card">
    <h3>选择通知渠道 <span class="ct">推荐 Server酱，最稳定、免费、接入最快</span></h3>
    <div class="row2">
      <div><label>通知渠道</label>
        <select id="chSel">
          <option value="serverchan" ${ch==='serverchan'?'selected':''}>Server酱（推荐）</option>
          <option value="pushplus" ${ch==='pushplus'?'selected':''}>PushPlus</option>
          <option value="wecom" ${ch==='wecom'?'selected':''}>企业微信机器人</option>
        </select>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>Server酱（推荐） <span class="ct">免费版每天5条，够小画室用</span></h3>
    <p style="font-size:12.5px;color:var(--ink3);font-weight:300;margin-bottom:10px">获取方式：微信打开 <b>sct.ftqq.com</b> → 用微信登录 → 复制 <b>SendKey</b> 填到下面。</p>
    <label>SendKey</label><input id="scKey" value="${esc(sc.sendKey||'')}" placeholder="SCTxxxxxxxxxxxx">
  </div>
  <div class="card">
    <h3>PushPlus（备选）</h3>
    <p style="font-size:12.5px;color:var(--ink3);font-weight:300;margin-bottom:10px">获取方式：微信打开 <b>pushplus.plus</b> → 登录 → 复制 <b>token</b>。</p>
    <label>Token</label><input id="ppToken" value="${esc(pp.token||'')}" placeholder="pushplus token">
  </div>
  <div class="card">
    <h3>企业微信机器人（备选）</h3>
    <p style="font-size:12.5px;color:var(--ink3);font-weight:300;margin-bottom:10px">获取方式：企业微信群 → 右上角 → 群机器人 → 添加 → 复制 Webhook 地址。</p>
    <label>Webhook 地址</label><input id="wcHook" value="${esc(wc.webhook||'')}" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=...">
  </div>
  <div class="actions">
    <button class="btn btn-p" id="setSave" style="padding:10px 28px">保存设置</button>
    <button class="btn" id="setTest">发送测试通知</button>
  </div>`);
  $("#setSave").addEventListener("click", async () => {
    const body = {
      notifyChannel: $("#chSel").value,
      serverchan: { sendKey: $("#scKey").value.trim() },
      pushplus: { token: $("#ppToken").value.trim() },
      wecom: { webhook: $("#wcHook").value.trim() }
    };
    try { await saveData("settings", body, "设置已保存，立即生效"); }
    catch (e) { toast(e.message, true); }
  });
  $("#setTest").addEventListener("click", async () => {
    toast("正在发送测试通知…");
    try {
      const r = await api("POST", "/api/test-notify", {});
      toast(r.ok ? "测试通知已发送，请查看微信" : "发送失败");
    } catch (e) { toast(e.message, true); }
  });
};
